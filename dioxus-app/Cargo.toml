[package]
name = "shrinkr"
version = "1.5.0"
edition = "2021"

[build-dependencies]
winresource = "0.1"

[dependencies]
dioxus = { version = "0.7", features = ["desktop", "router"] }
shrinkr-core = { path = "../core" }
rfd = "0.15"
walkdir = "2"
raw-window-handle = "0.6"
tw_merge = { version = "0.1", features = ["debug"] }
icons = { version = "0.18", features = ["dioxus"] }
futures-channel = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WM_CLOSE interception + native confirm box for the close-while-busy
# guard (see close_guard.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
