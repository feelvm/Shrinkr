[package]
name = "shrinkr"
version = "1.1.0"
edition = "2021"

[build-dependencies]
winresource = "0.1"

[dependencies]
dioxus = { version = "0.7", features = ["desktop", "router"] }
shrinkr-core = { path = "../core" }
rfd = "0.15"
walkdir = "2"
raw-window-handle = "0.6"
tw_merge = { version = "0.1", features = ["debug"] }
icons = { version = "0.18", features = ["dioxus"] }
futures-channel = "0.3"
futures-util = "0.3"
