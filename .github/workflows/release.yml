name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not cancel the others' uploads.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # arm64 runner — the Apple Silicon build
            target: aarch64-apple-darwin
          # Oldest still-supported runner: the artifact's glibc
          # requirement is that of the build machine, so building on
          # 22.04 keeps the binary runnable on older distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      # self_update matches assets by target triple, so the name must be
      # exactly `shrinkr-<triple>.zip` with all files at the archive root.
      ARCHIVE: shrinkr-${{ matrix.target }}.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dioxus desktop (wry/tao) needs WebKitGTK + GTK headers to build on
      # Linux — and the same libs at runtime on users' machines. rfd needs
      # libxdo at link time.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Build GUI and CLI
        run: cargo build --release --target ${{ matrix.target }} -p shrinkr -p shrinkr-cli

      # The archives ship static ffmpeg/ffprobe sidecars so users don't
      # need to install anything. Every download is pinned to an immutable
      # artifact AND verified against FFMPEG-PINS.sha256 before anything is
      # unpacked — the same pins file core/src/ffmpeg_fetch.rs checks at
      # runtime, so release builds and in-app downloads can never drift.
      # Bump procedure: FFMPEG-PINS.sha256 header + FFMPEG-NOTES.txt.
      - name: Download FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tag = "autobuild-2026-11-13-12-43"
          $asset = "ffmpeg-N-128889-g88c46fce27-win64-gpl.zip"
          $pin = Select-String -Path FFMPEG-PINS.sha256 -Pattern ("^[0-9a-f]{64}[ 	]+" + [regex]::Escape($asset)) |
            Select-Object -First 1
          if (-not $pin) { throw "no SHA-256 pin for $asset in FFMPEG-PINS.sha256" }
          $expected = ($pin.Line.Trim() -split '\s+')[0].ToLower()
          Invoke-WebRequest -Uri "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$tag/$asset" -OutFile ffmpeg.zip
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "ffmpeg.zip checksum mismatch: got $actual, expected $expected (see FFMPEG-PINS.sha256)"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-build
          New-Item -ItemType Directory -Force sidecars | Out-Null
          Copy-Item (Get-ChildItem -Recurse ffmpeg-build -Filter ffmpeg.exe | Select-Object -First 1).FullName sidecars/ffmpeg.exe
          Copy-Item (Get-ChildItem -Recurse ffmpeg-build -Filter ffprobe.exe | Select-Object -First 1).FullName sidecars/ffprobe.exe

      - name: Download FFmpeg sidecars (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tag="autobuild-2026-11-13-12-43"
          asset="ffmpeg-N-128889-g88c46fce27-linux64-gpl.tar.xz"
          expected=$(grep -E "^[0-9a-f]{64}[[:space:]]+${asset}\$" FFMPEG-PINS.sha256 | awk '{print $1}')
          if [ -z "$expected" ]; then
            echo "no SHA-256 pin for $asset in FFMPEG-PINS.sha256" >&2; exit 1
          fi
          curl -fsSL -o ffmpeg.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$tag/$asset"
          echo "$expected  ffmpeg.tar.xz" | sha256sum -c - >/dev/null || {
            echo "ffmpeg.tar.xz checksum mismatch against FFMPEG-PINS.sha256" >&2; exit 1
          }
          mkdir ffmpeg-build sidecars
          tar -xf ffmpeg.tar.xz -C ffmpeg-build
          cp -v "$(find ffmpeg-build -type f -name ffmpeg -print -quit)" sidecars/ffmpeg
          cp -v "$(find ffmpeg-build -type f -name ffprobe -print -quit)" sidecars/ffprobe

      - name: Download FFmpeg sidecars (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL -o ffmpeg.zip "https://www.osxexperts.net/ffmpeg902arm.zip"
          curl -fsSL -o ffprobe.zip "https://www.osxexperts.net/ffprobe902arm.zip"
          for pair in "ffmpeg.zip:ffmpeg902arm.zip" "ffprobe.zip:ffprobe902arm.zip"; do
            f="${pair%%:*}"; asset="${pair##*:}"
            expected=$(grep -E "^[0-9a-f]{64}[[:space:]]+${asset}\$" FFMPEG-PINS.sha256 | awk '{print $1}')
            if [ -z "$expected" ]; then
              echo "no SHA-256 pin for $asset in FFMPEG-PINS.sha256" >&2; exit 1
            fi
            actual=$(shasum -a 256 "$f" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "$f checksum mismatch: got $actual, expected $expected (FFMPEG-PINS.sha256)" >&2
              exit 1
            fi
          done
          mkdir ffmpeg-build ffprobe-build sidecars
          unzip -j ffmpeg.zip -d ffmpeg-build
          unzip -j ffprobe.zip -d ffprobe-build
          cp -v "$(find ffmpeg-build -type f -name 'ffmpeg*' -print -quit)" sidecars/ffmpeg
          cp -v "$(find ffprobe-build -type f -name 'ffprobe*' -print -quit)" sidecars/ffprobe

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "target/${{ matrix.target }}/release/shrinkr" \
                   "target/${{ matrix.target }}/release/shrinkr-cli" \
                   sidecars/ffmpeg sidecars/ffprobe
          zip -j "$GITHUB_WORKSPACE/${{ env.ARCHIVE }}" \
            "target/${{ matrix.target }}/release/shrinkr" \
            "target/${{ matrix.target }}/release/shrinkr-cli" \
            sidecars/ffmpeg sidecars/ffprobe \
            FFMPEG-NOTES.txt

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path @(
            "target/${{ matrix.target }}/release/shrinkr.exe",
            "target/${{ matrix.target }}/release/shrinkr-cli.exe",
            "sidecars/ffmpeg.exe",
            "sidecars/ffprobe.exe",
            "FFMPEG-NOTES.txt"
          ) -DestinationPath "${{ env.ARCHIVE }}" -Force
          Get-ChildItem ${{ env.ARCHIVE }}

      # Sign the self-update archive with the release signing key
      # (zipsign: an ed25519 signature embedded in the zip, salted with
      # the archive name). Every installed updater verifies this against
      # its committed updater-key.pub and REJECTS the archive on any
      # mismatch — so an unsigned release is unusable, not "less safe":
      # fail the workflow loudly rather than publish unverifiable bytes.
      # Key setup: `zipsign gen-key signing.key updater-key.pub`, commit
      # updater-key.pub, store `openssl base64 -A < signing.key` (or
      # `base64 -w0`) as the ZIPSIGN_SIGNING_KEY repo secret.
      - name: Sign update archive (zipsign)
        shell: bash
        env:
          ZIPSIGN_SIGNING_KEY: ${{ secrets.ZIPSIGN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ZIPSIGN_SIGNING_KEY" ]; then
            echo "::error::ZIPSIGN_SIGNING_KEY secret is not set — the updater rejects unsigned archives, so this release could not be installed. Generate with 'zipsign gen-key signing.key updater-key.pub' (commit updater-key.pub) and store the base64 of signing.key in the secret."
            exit 1
          fi
          cargo install zipsign --locked
          echo "$ZIPSIGN_SIGNING_KEY" | openssl base64 -d -A -out zipsign.key
          zipsign sign zip "${{ env.ARCHIVE }}" zipsign.key
          rm -f zipsign.key
          echo "signed ${{ env.ARCHIVE }}"

      # Separate download from the zip: the zip stays the self-update
      # asset (matched by target triple), while the setup exe is the
      # user-facing Windows install. Its name deliberately omits the
      # triple so the updater can never select it by mistake.
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./installer/windows/build-installer.ps1 `
            -Version $version `
            -SkipBuild `
            -TargetTriple "${{ matrix.target }}" `
            -FfmpegDir sidecars `
            -OutputDir .

      # User-facing drag-to-install image. The zip above stays the
      # self-update asset (matched by target triple); the DMG is an
      # additional download. Sidecars live in Contents/MacOS/ next to
      # the executables, where process::cmd's sidecar lookup finds them.
      - name: Build app bundle and DMG (macOS)
        if: runner.os == 'macOS'
        env:
          DMG: shrinkr-${{ matrix.target }}.dmg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="Shrinkr.app"
          rm -rf "$APP" icon.iconset
          mkdir -p icon.iconset "$APP/Contents/MacOS" "$APP/Contents/Resources"
          ICON="dioxus-app/assets/icons/icon.png"
          sips -z 16 16       "$ICON" --out icon.iconset/icon_16x16.png
          sips -z 32 32       "$ICON" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32       "$ICON" --out icon.iconset/icon_32x32.png
          sips -z 64 64       "$ICON" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128     "$ICON" --out icon.iconset/icon_128x128.png
          sips -z 256 256     "$ICON" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256     "$ICON" --out icon.iconset/icon_256x256.png
          sips -z 512 512     "$ICON" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512     "$ICON" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024   "$ICON" --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/Shrinkr.icns"
          cp "target/${{ matrix.target }}/release/shrinkr" "$APP/Contents/MacOS/Shrinkr"
          cp "target/${{ matrix.target }}/release/shrinkr-cli" "$APP/Contents/MacOS/"
          cp sidecars/ffmpeg sidecars/ffprobe "$APP/Contents/MacOS/"
          chmod +x "$APP"/Contents/MacOS/*
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Shrinkr</string>
            <key>CFBundleDisplayName</key><string>Shrinkr</string>
            <key>CFBundleIdentifier</key><string>com.shrinkr.app</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>Shrinkr</string>
            <key>CFBundleIconFile</key><string>Shrinkr</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # Ad-hoc signature: launches locally, no paid cert. Users still
          # clear Gatekeeper once (right-click > Open) without notarization.
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname "Shrinkr" -srcfolder "$APP" -ov -format UDZO "$GITHUB_WORKSPACE/$DMG"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First matrix job to arrive creates the release; the rest skip
          # straight to uploading their own archive (--clobber re-uploads
          # safely on retry).
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "${{ env.ARCHIVE }}" --clobber

      # Runs after Publish in the same job, so the release is guaranteed
      # to exist by now (created by this job or an earlier matrix job).
      - name: Publish DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "shrinkr-${{ matrix.target }}.dmg" --clobber

      - name: Publish installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${{ github.ref_name }}" "Shrinkr-Setup-${VERSION}-x64.exe" --clobber

  # Runs once, after every matrix job has uploaded its artifacts: publish
  # SHA256SUMS.txt so users (and mirroring scripts) can verify every
  # download — including the DMG and the installer, which carry no
  # embedded signature. Re-uploads are safe: the sums exclude themselves.
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          rm -rf sums-tmp && mkdir sums-tmp
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D sums-tmp
          cd sums-tmp
          ls | grep -v '^SHA256SUMS' | xargs sha256sum > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --clobber
