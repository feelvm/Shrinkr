name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build GUI
        run: cargo build --release -p shrinkr

      # self_update picks the asset containing the target triple.
      # The zip must contain shrinkr.exe at its root.
      - name: Package zip
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $zip = "shrinkr-$target.zip"
          Compress-Archive -Path "target/release/shrinkr.exe" -DestinationPath $zip -Force
          Get-ChildItem $zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "shrinkr-x86_64-pc-windows-msvc.zip"
