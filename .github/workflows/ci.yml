name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # arm64 runner — the Apple Silicon build
            target: aarch64-apple-darwin
          # Intel Mac: cross-compiled from the Apple Silicon runner
          # (no free hosted Intel macOS image remains), so this job
          # only checks — it can't execute Intel test binaries.
          - os: macos-latest
            target: x86_64-apple-darwin
            check_only: true
          # Same image the release workflow builds on, so a glibc/library
          # mismatch shows up here first, on every push.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dioxus desktop (wry/tao) needs WebKitGTK + GTK headers to build on
      # Linux — and the same libs at runtime on users' machines. rfd needs
      # libxdo at link time (cargo check won't catch a missing one).
      - name: Install Linux GUI deps + ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev ffmpeg

      # The image-plan tests exercise real capability detection (ffmpeg
      # `-muxers` probe), and no runner image ships ffmpeg on PATH.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Check (all targets)
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

      # check-only jobs (e.g. Intel Mac cross-compiled from an Apple
      # Silicon runner) can't execute the target's test binaries.
      - name: Test
        if: matrix.check_only != true
        run: cargo test --workspace --target ${{ matrix.target }}

  # The Windows installer is a first-class download: it sits next to the
  # portable zip in every release. Release tags are cut from master, so
  # building it on every master push means a broken installer (setup source,
  # staging, bundled license) fails CI before it can reach a release,
  # and the run's artifact is a testable preview of the same setup
  # users download. Not built for pull_request: that would double every
  # PR's CI cost for an artifact only master pushes publish.
  installer:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build GUI and CLI (release)
        run: cargo build --release -p shrinkr -p shrinkr-cli

      # Same pinned, checksum-verified FFmpeg build the release workflow
      # bundles (keep the tag/asset pair in sync with FFMPEG-PINS.sha256
      # and release.yml).
      - name: Download FFmpeg sidecars
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tag = "autobuild-2026-11-13-12-43"
          $asset = "ffmpeg-N-128889-g88c46fce27-win64-gpl.zip"
          $pin = Select-String -Path FFMPEG-PINS.sha256 -Pattern ("^[0-9a-f]{64}[ 	]+" + [regex]::Escape($asset)) |
            Select-Object -First 1
          if (-not $pin) { throw "no SHA-256 pin for $asset in FFMPEG-PINS.sha256" }
          $expected = ($pin.Line.Trim() -split '\s+')[0].ToLower()
          Invoke-WebRequest -Uri "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$tag/$asset" -OutFile ffmpeg.zip
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "ffmpeg.zip checksum mismatch: got $actual, expected $expected (see FFMPEG-PINS.sha256)"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-build
          New-Item -ItemType Directory -Force sidecars | Out-Null
          Copy-Item (Get-ChildItem -Recurse ffmpeg-build -Filter ffmpeg.exe | Select-Object -First 1).FullName sidecars/ffmpeg.exe
          Copy-Item (Get-ChildItem -Recurse ffmpeg-build -Filter ffprobe.exe | Select-Object -First 1).FullName sidecars/ffprobe.exe

      - name: Check installer formatting
        run: cargo fmt --manifest-path installer/windows/Cargo.toml --all --check

      - name: Build installer
        shell: pwsh
        run: |
          ./installer/windows/build-installer.ps1 `
            -SkipBuild `
            -FfmpegDir sidecars `
            -OutputDir .

      - name: Exercise install and uninstall
        shell: pwsh
        run: |
          function Start-And-Wait($file, $argLine) {
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = $file
            $info.Arguments = $argLine
            $info.UseShellExecute = $false
            $process = [System.Diagnostics.Process]::Start($info)
            if (-not $process.WaitForExit(180000)) {
              $process.Kill()
              throw "timed out: $file $argLine"
            }
            return $process.ExitCode
          }

          $setup = (Resolve-Path "installer/windows/target/release/shrinkr-setup.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP "shrinkr install test"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{4D8134AB-7963-468F-82AC-FCB570190ED3}"
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Shrinkr.lnk"
          $desktop = Join-Path $env:USERPROFILE "Desktop\Shrinkr.lnk"

          $code = Start-And-Wait $setup "/S `"/D=$dir`""
          if ($code -ne 0) { throw "setup exited with $code" }
          foreach ($name in @("shrinkr.exe", "shrinkr-cli.exe", "ffmpeg.exe", "ffprobe.exe", "FFMPEG-NOTES.txt", "LICENSE", "uninstall.exe")) {
            if (-not (Test-Path (Join-Path $dir $name))) { throw "$name was not installed" }
          }
          if (-not (Test-Path $lnk)) { throw "the Start Menu shortcut was not created" }
          if (Test-Path $desktop) { throw "a desktop shortcut was created in silent mode" }
          if (-not (Test-Path $key)) { throw "the uninstall registry entry was not written" }
          $path = (Get-ItemProperty "HKCU:\Environment").Path
          if (-not (($path -split ';') -contains $dir)) { throw "the install directory was not added to PATH" }

          $code = Start-And-Wait (Join-Path $dir "uninstall.exe") "/S"
          if ($code -ne 0) { throw "uninstaller exited with $code" }
          for ($i = 0; $i -lt 80; $i++) {
            $path = (Get-ItemProperty "HKCU:\Environment").Path
            if (-not (Test-Path $dir) -and -not (Test-Path $key) -and -not (Test-Path $lnk) -and -not (($path -split ';') -contains $dir)) { break }
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $dir) { throw "the install directory survived the uninstall" }
          if (Test-Path $key) { throw "the uninstall registry entry survived the uninstall" }
          if (Test-Path $lnk) { throw "the Start Menu shortcut survived the uninstall" }
          $path = (Get-ItemProperty "HKCU:\Environment").Path
          if (($path -split ';') -contains $dir) { throw "the PATH entry survived the uninstall" }

      - uses: actions/upload-artifact@v4
        with:
          name: shrinkr-windows-installer
          path: Shrinkr-Setup-*-x64.exe
          if-no-files-found: error
