name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest # arm64 runner — the Apple Silicon build
            target: aarch64-apple-darwin
          # Same image the release workflow builds on, so a glibc/library
          # mismatch shows up here first, on every push.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dioxus desktop (wry/tao) needs WebKitGTK + GTK headers to build on
      # Linux — and the same libs at runtime on users' machines.
      - name: Install Linux GUI deps + ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev ffmpeg

      # The image-plan tests exercise real capability detection (ffmpeg
      # `-muxers` probe), and no runner image ships ffmpeg on PATH.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Check (all targets)
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace
