[package]
name = "shrinkr-core"
version = "1.2.0"
edition = "2021"

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
self_update = { version = "1", features = ["archive-zip", "compression-zip-deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
