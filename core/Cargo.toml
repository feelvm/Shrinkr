[package]
name = "shrinkr-core"
version = "1.4.1"
edition = "2021"

[dependencies]
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
self_update = { version = "1", features = ["archive-zip", "compression-zip-deflate"] }
libjpeg-turbo-rs = "0.9"
lopdf = { version = "0.47", default-features = false, features = ["rayon"] }
oxipng = { version = "10.2", default-features = false, features = ["parallel", "zopfli"] }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
