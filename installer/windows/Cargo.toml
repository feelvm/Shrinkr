[workspace]
resolver = "3"
members = ["common", "setup", "uninstaller"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0"
lzma-rust2 = "0.25"
sha2 = "0.10"
windows-sys = "0.61"
winreg = "0.56"

# Compression speed matters for the ~360 MB payload; code size does not.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
