[package]
name = "shrinkr-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "shrinkr-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
common = { package = "shrinkr-installer-common", path = "../common" }
lzma-rust2.workspace = true
sha2.workspace = true
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[build-dependencies]
anyhow.workspace = true
embed-resource = "3"
lzma-rust2 = { workspace = true, features = ["encoder"] }
sha2.workspace = true
